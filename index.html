<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joc de simultaneïtat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Disseny: taulell de sala de control. Mapa a l'esquerra, rols a la dreta, rellotge a dalt. */
:root{
  --bg:#efedf1;--surface:#fff;--ink:#1c1822;--muted:#655e6f;--line:#d9d3df;
  --accent:#5a2d82;--accent-ink:#fff;--tint:#ede5f5;--sea:#cddde8;--land:#f7f5f9;
  --p1:#c1272d;--p2:#c9620a;--p3:#1d6aa8;--p4:#6a6f7b;--ok:#2c7a4b;--warn:#a86a00;--bad:#c1272d;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141118;--surface:#1f1b25;--ink:#ece8f1;--muted:#a69eb1;--line:#383141;
  --accent:#b993e6;--accent-ink:#17131c;--tint:#2c2238;--sea:#1b3140;--land:#262130;
  --p1:#ef6a6e;--p2:#f0a04a;--p3:#6cb2ea;--p4:#a2a7b3;--ok:#62c48a;--warn:#e3b04a;--bad:#ef6a6e;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141118;--surface:#1f1b25;--ink:#ece8f1;--muted:#a69eb1;--line:#383141;
  --accent:#b993e6;--accent-ink:#17131c;--tint:#2c2238;--sea:#1b3140;--land:#262130;
  --p1:#ef6a6e;--p2:#f0a04a;--p3:#6cb2ea;--p4:#a2a7b3;--ok:#62c48a;--warn:#e3b04a;--bad:#ef6a6e;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:44px;line-height:1;font-weight:700;text-transform:uppercase}
h2{font-size:26px;font-weight:600}
h3{font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
h3:first-child{margin-top:0}
p{margin:0 0 10px}
small{display:block;color:var(--muted);font-size:12px;font-weight:400}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:14px;color:var(--accent);margin-bottom:6px}
.eyebrow.ok{color:var(--ok)}.eyebrow.bad{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:6px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.big{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.05em;padding:8px 20px}
.btn:hover{filter:brightness(1.1)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.cp{border-color:var(--p3);color:var(--p3)}.chip.pc,.chip.cca{border-color:var(--accent);color:var(--accent)}.chip.cca{background:var(--tint)}
.chip.warn,.chip.filt{border-color:var(--warn);color:var(--warn)}.chip.bad{border-color:var(--bad);color:var(--bad)}.chip.ok{border-color:var(--ok);color:var(--ok)}
.empty,.hint{color:var(--muted);font-size:14px}.hint{margin-top:8px}
.tw{overflow-x:auto}

#head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:3px solid var(--accent)}
.brand b{font-family:var(--display);font-size:26px;letter-spacing:.08em;display:block;line-height:1}
.brand span{font-size:12px;color:var(--muted)}
.steps{display:flex;gap:4px;list-style:none;margin:0;padding:0;flex:1;flex-wrap:wrap}
.steps li{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:14px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:99px;color:var(--muted);display:flex;align-items:center;gap:6px}
.steps i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--ink);display:grid;place-items:center;font-size:12px}
.steps li.on{border-color:var(--accent);color:var(--accent);background:var(--tint)}.steps li.on i{background:var(--accent);color:var(--accent-ink)}
.clock{text-align:right}.clock b{font-family:var(--display);font-size:34px;line-height:1;display:block;font-variant-numeric:tabular-nums}.clock span{font-size:12px;color:var(--muted)}
.hbtn{display:flex;gap:6px}

#main{flex:1;min-height:0;padding:14px 16px;overflow:auto}
.play{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:14px;height:100%;min-height:560px}
.left{display:flex;flex-direction:column;gap:14px;min-height:0}
.logc{flex:1;min-height:120px;overflow:auto}
.right{display:flex;flex-direction:column;min-height:0;padding:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 8px;font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab i{font-style:normal;background:var(--p1);color:#fff;border-radius:99px;font-size:12px;padding:0 6px;margin-left:6px;font-family:var(--body)}
.panel{flex:1;overflow:auto;padding:14px;min-height:0}
.foot{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.foot span{flex:1;color:var(--muted);font-size:13px;min-width:180px}

svg{width:100%;height:auto;display:block}
.sea{fill:var(--sea)}.seat{fill:var(--muted);font:italic 13px var(--body);opacity:.8}
.zone{fill:color-mix(in srgb,var(--p2) calc(var(--t)*55%),var(--land));stroke:var(--line);stroke-width:1.5}
.zone.haspc{stroke:var(--accent);stroke-width:3}.zone.over{stroke:var(--bad);stroke-width:3;stroke-dasharray:6 4}
.zn{font:600 11px var(--body);fill:var(--ink);text-anchor:middle}
.zc{font:700 30px var(--display);fill:var(--ink);text-anchor:middle}
.ubi{fill:var(--ink)}.ubi.disc{fill:var(--p3)}.ubi.rest{fill:none;stroke:var(--ink)}
.agr{stroke:var(--muted);stroke-width:3;stroke-linecap:round}.agr.on{stroke:var(--p3)}.agr.over{stroke:var(--bad)}
.agrt{font:600 13px var(--display);letter-spacing:.06em;fill:var(--muted)}.agrt.on{fill:var(--p3)}.agrt.over{fill:var(--bad)}
.pcb,.ccab{fill:var(--accent)}.pct,.ccat{fill:var(--accent-ink);font:700 11px var(--body);text-anchor:middle}.ccat{font-size:11px;letter-spacing:.04em}
.park{fill:var(--p1);stroke:var(--surface);stroke-width:1.5}.park.ext{fill:var(--muted)}.park.ext.empty{fill:none;stroke:var(--bad)}
.parkt{font:500 11px var(--body);fill:var(--ink)}.extl{font:600 12px var(--display);letter-spacing:.08em;fill:var(--muted)}
.river{stroke:var(--p3);stroke-width:5;opacity:.45;stroke-linecap:round}
.scsel{display:grid;gap:4px;font:600 13px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:16px}.scsel select{font:500 17px var(--body);text-transform:none;letter-spacing:0;color:var(--ink);padding:8px}
.corona{border:1px solid var(--line);border-radius:6px;margin-bottom:10px;overflow:hidden}.chead{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;padding:8px 10px;background:var(--bg)}.chead b{font:600 17px var(--display);text-transform:uppercase;letter-spacing:.05em}.chead small{flex:1;min-width:160px}
.mapnote{font-size:12px;color:var(--muted);margin:6px 0 0}

.log,.keys,.inbox,.errs,.p1l{list-style:none;margin:0;padding:0}
.log li,.keys li{display:flex;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.log time,.keys time{font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.log li.bad span{color:var(--bad);font-weight:600}.log li.good span{color:var(--ok)}.log li.warn span{color:var(--warn)}
.keys li.ok span::before{content:"✓ ";color:var(--ok);font-weight:700}.keys li.bad span::before{content:"✕ ";color:var(--bad);font-weight:700}

.capbox{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:12px;background:var(--bg)}
.capbox>div:first-child{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.capbox p{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.capbar{height:8px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}.capbar i{display:block;height:100%;background:var(--accent)}
.flash{background:var(--bad);color:#fff;padding:6px 10px;border-radius:4px;font-weight:600}
.inbox li{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:4px;padding:8px 10px;margin-bottom:8px}
.ah{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px}.aid{font-family:var(--display);font-size:18px;font-weight:700}
.inbox p{margin:0 0 8px;font-size:15.5px}
.ab{display:flex;gap:6px;flex-wrap:wrap}
.pb{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:4px 9px;cursor:pointer;font-size:13px}
.pb b{font-family:var(--display);font-size:15px}
.pb.p1{border-color:var(--p1);color:var(--p1)}.pb.p2{border-color:var(--p2);color:var(--p2)}.pb.p3{border-color:var(--p3);color:var(--p3)}.pb.p4{border-color:var(--p4);color:var(--p4)}.pb.px{border-style:dashed;color:var(--muted)}
.pb:hover{background:var(--tint)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font:600 12px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:4px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num{font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}td.num.bad{color:var(--bad)}
td.sub{padding-left:22px}tr.agrrow td{background:var(--bg)}
.uid{font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap}
select,input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:4px 6px;max-width:100%}
.send{display:flex;gap:6px;flex-wrap:wrap}.tr{color:var(--muted);font-size:13px}
.fat{display:inline-block;width:70px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;vertical-align:middle}.fat i{display:block;height:100%}
.fat.ok i{background:var(--ok)}.fat.warn i{background:var(--warn)}.fat.bad i{background:var(--bad)}
.blk{margin-bottom:22px}.dep{color:var(--muted);font-size:13.5px}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:10px}
.area{border:1px solid var(--line);border-radius:4px;padding:8px 10px}.area b{display:block}.area span{font-size:13px;color:var(--muted)}.area.ispc{border-color:var(--accent);background:var(--tint)}
.d{font-style:normal;font-weight:700}.d.p1{color:var(--p1)}.d.p2{color:var(--p2)}.d.p3{color:var(--p3)}.d.p4{color:var(--p4)}
.okline{color:var(--ok);font-weight:600}.p1l li{padding:4px 0;font-size:14px}

.prep{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;max-width:1180px;margin:0 auto;align-items:start}
.lead{font-size:18px;max-width:60ch}
.roles{display:grid;gap:8px;margin-top:18px}.roles div{border-left:3px solid var(--accent);padding:2px 0 2px 12px}.roles b{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.04em;display:block}.roles span{color:var(--muted);font-size:14px}
.prepform{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px}
.chk{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}.chk input{width:18px;height:18px;flex:none;margin-top:2px;accent-color:var(--accent)}
.res{margin:14px 0;font-size:14px}.res b{display:block}.res span{display:block;color:var(--muted)}
.startrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.startrow input{width:90px}

.ov{position:fixed;inset:0;background:rgba(15,10,20,.55);display:grid;place-items:center;padding:16px;z-index:10;overflow:auto}
.dlg{background:var(--surface);border-radius:8px;border-top:5px solid var(--accent);padding:22px;max-width:560px;width:100%}.dlg.wide{max-width:820px}
.dlg h2{margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-top:8px;cursor:pointer}.opt:hover{border-color:var(--accent);background:var(--tint)}
blockquote{margin:10px 0 16px;padding:10px 14px;border-left:4px solid var(--accent);background:var(--tint);font-size:16px}cite{display:block;font-size:12px;color:var(--muted);margin-top:6px;font-style:normal}
.prio{padding-left:0;list-style:none}.prio li{padding:3px 0}

.end{max-width:980px;margin:0 auto;display:grid;gap:14px}
.total{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:6px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:6px 30px;align-items:center}
.total .eyebrow,.endbtn{grid-column:1/-1}
.total .big{font:700 110px/0.9 var(--display)}.total .big small{font-size:16px;font-family:var(--body)}
.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:minmax(120px,240px) 1fr 34px;gap:10px;align-items:center;font-size:14px}.bar em{color:var(--muted);font-style:normal;font-size:12px}
.bar>div{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%}.bar i.ok{background:var(--ok)}.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.bar b{font-family:var(--display);font-size:20px;text-align:right}
.endbtn{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.errs li{padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}

.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.two section{min-width:0}.two h3{margin-top:0;display:flex;align-items:center;gap:8px}
.cnt{font-style:normal;background:var(--ink);color:var(--surface);border-radius:99px;font:600 13px var(--body);padding:0 8px;letter-spacing:0}
.hint.top{margin:0 0 8px}
.sendt td,.sendt th{padding:5px 4px;text-align:center}.sendt td:first-child,.sendt th:first-child{text-align:left}
.pk{min-width:34px;border:1.5px solid currentColor;background:var(--surface);border-radius:4px;font:700 18px var(--display);padding:2px 6px;cursor:pointer}
.pk.p1{color:var(--p1)}.pk.p2{color:var(--p2)}.pk.p3{color:var(--p3)}.pk.p4{color:var(--p4)}.pk:hover{background:var(--tint)}
.pk.all{border-width:3px}
.pk0{color:var(--line)}
.fl{white-space:nowrap;font-size:13px;font-variant-numeric:tabular-nums}.fl b{font:600 17px var(--display)}.fl.warn{color:var(--warn)}.fl.bad{color:var(--bad)}
tr.allrow td{background:var(--bg);border-bottom:0}tr.agrrow.top td{border-top:2px solid var(--ink)}
@media (max-width:1250px){.two{grid-template-columns:1fr}.two section:last-child{order:-1}}
.coach{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;overflow:hidden}
.coach>div{background:var(--tint);padding:8px 12px}
.coach b{font:600 14px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.coach ul{list-style:none;margin:4px 0 0;padding:0}
.coach li{margin:2px 0}
.cgo{all:unset;cursor:pointer;display:block;font-size:13.5px;line-height:1.35;padding:2px 0 2px 16px;position:relative}
.cgo::before{content:"›";position:absolute;left:2px;color:var(--accent);font-weight:700}
.coach li.u .cgo{color:var(--bad);font-weight:600}.coach li.u .cgo::before{content:"!";color:var(--bad)}
.coach li.ok .cgo{color:var(--ok)}.coach li.ok .cgo::before{content:"✓";color:var(--ok)}
.cgo:hover{text-decoration:underline}.cgo:focus-visible{outline:2px solid var(--accent)}
.btn.ghost.on{background:var(--tint)}
.how{margin-top:18px;border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--surface)}
.how>b{font:600 17px var(--display);text-transform:uppercase;letter-spacing:.06em}
.how ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.how li{display:flex;gap:10px;font-size:14.5px}.how li>span{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.mstep{list-style:none;display:flex;gap:4px;margin:0 0 14px;padding:0;flex-wrap:wrap}
.mstep li{flex:1;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mstep i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-weight:700;color:var(--muted)}
.mstep li.cur i{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}.mstep li.cur{color:var(--accent);font-weight:600}
.mstep li.ok i{border-color:var(--ok);color:var(--ok)}.mstep li.bad i{border-color:var(--bad);color:var(--bad)}
.mcard h2{margin-bottom:8px}.mq{font-size:16.5px}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}.opt.dim{opacity:.55}.opt:disabled{cursor:default}
.mnext{display:flex;justify-content:flex-end;margin-top:12px}
.prac li{border-left-width:1px}.prac p{margin-bottom:6px}
.fbk{font-size:14px;font-weight:600;margin:4px 0 0}.fbk.ok{color:var(--ok)}.fbk.bad{color:var(--bad)}
.pracsend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--accent);border-radius:6px;padding:10px;margin-top:6px}.pracsend span{flex:1;min-width:200px;font-size:14px}
.pk.all{padding:4px 12px;font-size:16px}
.introl{padding-left:20px;display:grid;gap:8px;margin:8px 0 12px}
.cart{padding:10px 14px}
.carth{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}.carth h3{margin:0}
.lg{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:6px}
.sw.p1,.seg.p1{background:var(--p1)}.sw.p2,.seg.p2{background:var(--p2)}.sw.p3,.seg.p3{background:var(--p3)}.sw.p4,.seg.p4{background:var(--p4)}
.sw.held,.seg.held{background:repeating-linear-gradient(135deg,var(--line) 0 4px,var(--surface) 4px 8px);border:1px solid var(--muted)}
.crow{display:grid;grid-template-columns:185px 1fr 70px;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.crow.sct .cn b{color:var(--muted)}.crow.pc .cn b{color:var(--accent)}.crow.cp .cn b{color:var(--p3)}
.cn b{display:block;font-size:13.5px;line-height:1.2}.cn small{font-size:11.5px}
.cbar{position:relative;display:flex;height:22px;background:var(--bg);border-radius:4px;overflow:hidden}
.seg{display:grid;place-items:center;color:#fff;font:700 12px var(--body);min-width:0}.seg.held{color:var(--ink)}
.res2{font-size:11.5px;line-height:1.35;margin-top:3px;color:var(--muted)}.crow .cn .res2 b{display:inline;font-size:11.5px;color:var(--ink)}.res2.bad,.res2.bad b{color:var(--bad)}
.lim{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}

  /* Segona bústia: enviar al terreny per paquets (zona i prioritat; null = totes). */
  function send(S, zone, pri) {

  function setCP(S, g, on) {

    } else {
      if (!S.st.cp[g]) return;
      const pcs = AGR[g].zones.some(z => S.st.pc[z]);
      if (S.st.cca || pcs) { S.m.orderErr++; key(S, 'Has retirat el c' + cpN(g).slice(1) + ' abans que ' + (S.st.cca ? 'el CCA' : 'el punt de comandament') + ": l'ordre és CCA → punts de comandament → control parc.", false); }
      if (agrCount(S, g) > 10) { S.m.premature++; key(S, cpN(g) + ' retirat amb més de 10 actuacions obertes.', false); }
      S.st.cp[g] = null; S.logi[g] = null;

  }
  function setPC(S, z, on) {

      if (S.st.pc[z]) return;
      const c = zoneCount(S, z), fast = S.st.cp[g] === 'on';
      S.st.pc[z] = fast ? 'on' : 'pend';
      key(S, 'Punt de comandament a ' + ZONES[z].name + ' desplegat amb ' + c + ' actuacions' + (fast ? ', a partir del control parc.' : ', sense control parc previ.'), c <= 24 && fast);
      log(S, 'Punt de comandament a ' + ZONES[z].name + (fast ? ' actiu.' : " en desplegament: serà operatiu el torn següent."), 'good');

      if (zoneCount(S, z) > 20) { S.m.premature++; key(S, 'Punt de comandament de ' + ZONES[z].name + ' retirat amb més de 20 actuacions.', false); }

      log(S, cur.cca + " actiu. És l'interlocutor únic amb la sala (SISCOM 3).", 'good');

  function setLogi(S, g) { if (S.st.cp[g] === 'on' && !S.logi[g]) { S.logi[g] = S.round; S.logiEver = true; log(S, "Logística activada a l'" + AGR[g].name + ': avituallament, combustible, material i unitat Limes.', 'good'); } }

  function moveUbi(S, id, zone) {

        guia: 'Preveure els recursos de reforç i reserva i prealertar els parcs veïns.', fx: 'Al joc: si encertes, els reforços arribaran un torn abans. Moure les UBI abans d\'hora deixa parcs sense cobertura.' },
      { id: 'comunica', role: 'cct', title: 'Comunica el dispositiu', q: 'A qui comuniques el dispositiu i quan?',
        opts: [{ t: "Als caps de guàrdia dels parcs afectats, quan s'activi cada estructura" }, { t: "Només a la sala: els parcs ja ho sabran per l'emissora" }, { t: "A tot el personal de la sala i als parcs afectats, abans que comenci l'episodi", good: true }],
        guia: "Comunicar el dispositiu a tot el personal i als parcs afectats abans que comenci l'episodi.", fx: 'Al joc: amb els controls parc predefinits i comunicats, no perdeu cap torn en activar-los.' }

  }

  /* ---------- què heu de fer ara ---------- */
  function coach() {
    const T = [], C = [], hd = E.held(S), ib = E.inbox(S).length, hp1 = hd.filter(a => a.cls === 1).length;
    if (ib) T.push({ t: 'Prioritzeu els ' + ib + ' avisos de la bústia 1. Comenceu pels que tenen persones en risc.', u: ib > 4 });
    if (hp1) T.push({ t: 'Envieu ja les ' + hp1 + ' P1 de la bústia 2: no poden esperar.', u: true });
    const room = E.ZONES.filter(z => { const f = E.fieldLoad(S, z.id); return f.open < f.limit && hd.some(a => a.zone === z.id && a.cls > 1); });
    if (room.length) T.push({ t: 'Hi ha marge al terreny a ' + room.map(z => z.name).join(', ') + ': envieu-hi els paquets P2 i P3.' });
    if (!T.length) T.push({ t: 'Bústies al dia.', ok: true });
    const nocp = !S.st.cp.S && !S.st.cp.N;
    if (!E.SC.multi && nocp) { const t = E.total(S); if (t > 10) C.push({ t: "L'agrupació té " + t + ' actuacions i el llindar és 10: activeu un control parc.', u: true }); else if (t >= 7) C.push({ t: "L'agrupació s'acosta al llindar (" + t + ' de 10). Activar el control parc abans de superar-lo puntua.' }); }
    else for (const g of Object.values(E.AGR)) { const c = E.agrCount(S, g.id); if (!S.st.cp[g.id]) { if (c > 10) C.push({ t: "L'" + g.name + ' té ' + c + ' actuacions: activeu el control parc de ' + E.PARKS[g.park].name + '.', u: true }); else if (c >= 7 && (E.SC.multi || E.anyCP(S))) C.push({ t: "L'" + g.name + " s'acosta al llindar (" + c + ' de 10).' }); } }
    for (const z of E.ZONES) { const zc = E.zoneCount(S, z.id); if (zc > 20 && !S.st.pc[z.id]) C.push({ t: z.name + ' té ' + zc + ' actuacions (llindar 20): desplegueu-hi un punt de comandament.', u: true }); }
    if (E.pcCount(S) >= 2 && !S.st.cca) C.push({ t: "Hi ha més d'un punt de comandament: escaleu a " + E.SC.cca + '.', u: true });
    const bare = E.ZONES.filter(z => !S.ubis.some(x => x.zone === z.id || x.dest === z.id) && S.acts.some(a => a.zone === z.id && E.live(a) && (a.cls === 1 || a.kind === 1)));
    if (bare.length) C.push({ t: bare.map(z => z.name).join(', ') + (bare.length > 1 ? ' tenen' : ' té') + ' persones en risc i cap UBI: envieu-hi reforç des de les corones.', u: true });
    if (S.round >= 12 && (E.anyCP(S) || E.anyPC(S) || S.st.cca) && E.total(S) <= 10) C.push({ t: "L'episodi afluixa: retireu les estructures en ordre invers (CCA, punts de comandament, control parc)." });
    if (!C.length) C.push({ t: 'Res urgent. Reviseu el mapa i els reforços.', ok: true });
    const li = (x, r) => '<li class="' + (x.u ? 'u' : x.ok ? 'ok' : '') + '"><button class="cgo" data-a="tab" data-v="' + r + '">' + esc(x.t) + '</button></li>';
    return '<div class="coach"><div><b>TEOC · ara</b><ul>' + T.map(x => li(x, 'teoc')).join('') + '</ul></div><div><b>Charlie · ara</b><ul>' + C.map(x => li(x, 'cct')).join('') + '</ul></div></div>';
  }
  const zn = z => E.ZONES[z].name;
  /* Comandament màxim de cada UBI segons la plantilla per torn: tipus A (1 sergent, 2 caporals) i B (1 sergent, 1 caporal) → la primera UBI la porta el sergent; tipus C → caporal. */
  const cmdOf = u => { const t = E.PARKS[u.park].type, n = +u.id.split('-').pop(); return (t === 'A' || t === 'B') && n === 1 ? 'Sergent' : 'Caporal'; };

  /* ---------- mapa esquemàtic ---------- */
  function map() {
    const o = [92, 408], u = [107, -36], n = [-34, -98];
    const P = (i, a, b) => [o[0] + u[0] * (i + a) + n[0] * b, o[1] + u[1] * (i + a) + n[1] * b];
    const pt = p => p[0].toFixed(0) + ',' + p[1].toFixed(0);
    const SC = E.SC, pos = i => SC.map.rev ? 5 - i : i;
    let h = '<svg viewBox="0 0 760 440" role="img" aria-label="Mapa esquemàtic amb les sis zones de l\'escenari">';
    if (SC.map.sea) h += '<polygon class="sea" points="' + [P(0, -0.6, 0), P(6, 0.3, 0), [760, 440], [20, 440]].map(pt).join(' ') + '"/><text class="seat" x="560" y="400">' + SC.map.sea + '</text>';

    for (const g of Object.values(E.AGR)) {
      const ps = g.zones.map(pos), lo = Math.min.apply(null, ps), hi = Math.max.apply(null, ps), a = P(lo, 0.04, 1.14), b = P(hi, 0.96, 1.14), c = E.agrCount(S, g.id), st = S.st.cp[g.id];
      const cls = st ? 'on' : (c > 10 && (E.anyCP(S) || SC.multi) ? 'over' : '');
      h += '<line class="agr ' + cls + '" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>';
      const m = P(lo, 0.06, 1.2);
      h += '<text class="agrt ' + cls + '" transform="translate(' + m[0].toFixed(0) + ',' + m[1].toFixed(0) + ') rotate(-18.6)">' + g.name.toUpperCase() + ' · ' + c + ' act.' + (st ? (st === 'on' ? ' · CP' : ' · CP EN CAMÍ') : '') + '</text>';
    }
    for (const z of E.ZONES) {
      const c = E.zoneCount(S, z.id), pc = S.st.pc[z.id], t = Math.min(1, c / 22);
      const poly = [P(pos(z.id), 0.03, 0), P(pos(z.id), 0.97, 0), P(pos(z.id), 0.97, 1), P(pos(z.id), 0.03, 1)].map(pt).join(' ');
      h += '<polygon class="zone' + (pc ? ' haspc' : '') + (c > 20 && !pc ? ' over' : '') + '" style="--t:' + t.toFixed(2) + '" points="' + poly + '"/>';
      const m = P(pos(z.id), 0.5, 0.5), parts = z.name.split(' – ');
      h += '<text class="zn" x="' + m[0] + '" y="' + (m[1] - 26) + '">' + esc(parts[0]) + '</text>';
      if (parts[1]) h += '<text class="zn" x="' + m[0] + '" y="' + (m[1] - 13) + '">' + esc(parts[1]) + '</text>';
      h += '<text class="zc" x="' + m[0] + '" y="' + (m[1] + 16) + '">' + c + '</text>';
      const ub = S.ubis.filter(x => x.zone === z.id);
      ub.forEach((x, i) => { h += '<rect class="ubi ' + x.mode + '" x="' + (m[0] - ub.length * 5 + i * 10) + '" y="' + (m[1] + 24) + '" width="8" height="8" rx="1"><title>' + x.id + '</title></rect>'; });
      if (pc) h += '<g transform="translate(' + (m[0] - 17) + ',' + (m[1] - 58) + ')"><rect class="pcb" width="34" height="15" rx="3"/><text class="pct" x="17" y="11">PC</text></g>';
    }
    if (SC.map.river) { const r1 = P(-0.45, 0, 0.1), r2 = P(6.3, 0, 0.1); h += '<line class="river" x1="' + r1[0] + '" y1="' + r1[1] + '" x2="' + r2[0] + '" y2="' + r2[1] + '"/><text class="seat" x="14" y="398">← ' + SC.map.river + '</text>'; }
    for (const k of Object.keys(E.PARKS).filter(x => E.PARKS[x].zone !== null)) {
      const p = P(pos(E.PARKS[k].zone), 0.5, -0.12);
      h += '<circle class="park" cx="' + p[0] + '" cy="' + p[1] + '" r="5"/><text class="parkt" x="' + (p[0] + 9) + '" y="' + (p[1] + 4) + '">Parc ' + E.PARKS[k].name.split(' i ')[0] + ' (' + E.PARKS[k].type + ')</text>';
    }
    const ext = SC.map.ext;
    h += '<text class="extl" x="22" y="30">CORONA 1 · UBI AL PARC</text>';
    for (const k in ext) {
      const home = S.ubis.filter(x => x.park === k && x.zone === null && x.dest === null).length;
      h += '<circle class="park ext' + (home ? '' : ' empty') + '" cx="' + ext[k][0] + '" cy="' + ext[k][1] + '" r="4"/><text class="parkt" x="' + (ext[k][0] + 8) + '" y="' + (ext[k][1] + 4) + '">' + k + ' ' + home + '/' + E.PARKS[k].ubi + '</text>';
    }
    { const t = E.total(S), nocp = !S.st.cp.S && !S.st.cp.N; h += '<text class="agrt ' + (t > 10 && nocp && !SC.multi ? 'over' : '') + '" x="104" y="430">' + (SC.multi ? 'AGRUPACIONS ' : 'AGRUPACIÓ ') + E.AGRUP.name.toUpperCase() + ' · ' + t + ' ACTUACIONS' + (t > 10 && nocp && !SC.multi ? ' · SUPERA 10 SENSE CONTROL PARC' : '') + '</text>'; }
    if (S.st.cca) h += '<g transform="translate(590,22)"><rect class="ccab" width="150" height="24" rx="4"/><text class="ccat" x="75" y="16">' + SC.cca.toUpperCase() + ' · SISCOM 3</text></g>';
    return h + '</svg><p class="mapnote">Esquema no a escala. El número gran són les actuacions pendents de la zona, enviades o no; els quadrats, les UBI que hi treballen. CP: control parc actiu.</p>';
  }

  /* ---------- peces ---------- */
  function fatBar(u) { const p = Math.min(100, u.fat * 10), c = u.fat >= 6 ? 'bad' : u.fat >= 4 ? 'warn' : 'ok'; return '<span class="fat ' + c + '" title="Fatiga ' + u.fat.toFixed(1) + ' de 10"><i style="width:' + p + '%"></i></span>'; }
  function ubiTable(list, zones, allowHome) {
    if (!list.length) return '<p class="empty">Cap UBI en aquest àmbit.</p>';
    let h = '<div class="tw"><table class="ut"><thead><tr><th>Unitat</th><th>Comandament</th><th>On és</th><th>Tasca</th><th>Fatiga</th></tr></thead><tbody>';
    for (const u of list) {
      let where, task;
      if (u.dest !== null) { where = '<span class="tr">En camí cap a ' + zn(u.dest) + ' · ' + u.eta + (u.eta === 1 ? ' torn' : ' torns') + '</span>'; task = '—'; }
      else {
        where = '<select id="z-' + u.id + '" data-a="move" data-id="' + u.id + '" aria-label="Zona de ' + u.id + '">' + zones.map(z => '<option value="' + z + '"' + (z === u.zone ? ' selected' : '') + '>' + zn(z) + '</option>').join('') + (allowHome && E.PARKS[u.park].zone === null ? '<option value="home">Retorn al parc</option>' : '') + '</select>';
        const disc = E.zoneOwner(S, u.zone) !== 'sct';
        task = u.lock > 0 ? '<span class="tr">Fora de servei</span>' : '<select id="m-' + u.id + '" data-a="mode" data-id="' + u.id + '" aria-label="Tasca de ' + u.id + '"><option value="int"' + (u.mode === 'int' ? ' selected' : '') + '>Intervenció</option>' + (disc ? '<option value="disc"' + (u.mode === 'disc' ? ' selected' : '') + '>Discriminador</option>' : '') + '<option value="rest"' + (u.mode === 'rest' ? ' selected' : '') + '>Descans</option></select>';
      }
      h += '<tr><td class="uid">' + u.id + '</td><td>' + (cmdOf(u) === 'Sergent' ? chip('Sergent', 'pc') : chip('Caporal')) + '</td><td>' + where + '</td><td>' + task + '</td><td>' + fatBar(u) + '</td></tr>';
    }
    return h + '</tbody></table></div>';
  }
  const chip = (t, c) => '<span class="chip ' + (c || '') + '">' + t + '</span>';

  /* ---------- panells per rol ---------- */
  function pTeoc() {
    const ib = E.inbox(S), hd = E.held(S), cap = E.cap(S), left = Math.max(0, cap - S.used);
    let h = '<div class="capbox"><div><b>Capacitat de la sala aquest torn</b><span>' + (left % 1 ? left.toFixed(1) : left) + ' gestions de ' + cap + '</span></div><div class="capbar"><i style="width:' + (100 * left / cap) + '%"></i></div><p>Prioritzar un avís costa una gestió, o mitja si la zona ja té control parc o punt de comandament. Enviar no costa res. Les actuacions enviades que la sala segueix directament li resten capacitat.</p></div>';
    if (flash) h += '<p class="flash">' + flash + '</p>';
    h += '<div class="two"><section><h3>Bústia 1 · Per prioritzar <i class="cnt">' + ib.length + '</i></h3>';
    if (!ib.length) h += '<p class="empty">Cap avís pendent de prioritzar.</p>';
    else {
      h += '<ul class="inbox">';
      for (const a of ib) {
        h += '<li><div class="ah"><span class="aid">#' + a.id + '</span>' + chip(zn(a.zone)) + (S.round - a.born >= 1 ? chip('Espera ' + (S.round - a.born) * 15 + ' min', 'warn') : '') + (S.prep.filtre && a.dupOf ? chip("Filtre: coincideix amb l'avís #" + a.dupOf, 'filt') : '') + '</div><p>' + esc(a.text) + '</p><div class="ab">' +
          [[1, 'Persones en risc'], [2, 'Risc associat'], [3, 'Servei essencial'], [4, 'Sense risc immediat']].map(x => '<button class="pb p' + x[0] + '" data-a="cls" data-id="' + a.id + '" data-v="' + x[0] + '" title="' + x[1] + '"><b>P' + x[0] + '</b> ' + x[1] + '</button>').join('') +
          '<button class="pb px" data-a="cls" data-id="' + a.id + '" data-v="close">Duplicat o no vigent</button></div></li>';
      }
      h += '</ul>';
    }
    h += '</section><section><h3>Bústia 2 · Per enviar <i class="cnt">' + hd.length + '</i></h3><p class="hint top">Cada casella és un paquet: les actuacions prioritzades d\'una zona i una prioritat. Premeu-la per enviar-lo. El terreny només veu el que heu enviat.</p><div class="tw"><table class="sendt"><thead><tr><th>Zona</th>' + [1, 2, 3, 4].map(p => '<th class="d p' + p + '">P' + p + '</th>').join('') + '<th>Al terreny</th></tr></thead><tbody>';
    for (const z of E.ZONES) {

      for (const p of [1, 2, 3, 4]) { const c = hd.filter(a => a.zone === z.id && a.cls === p).length; h += '<td>' + (c ? '<button class="pk p' + p + '" data-a="send" data-z="' + z.id + '" data-p="' + p + '" aria-label="Envia ' + c + ' actuacions P' + p + ' de ' + z.name + '">' + c + '</button>' : '<span class="pk0">·</span>') + '</td>'; }
      h += '<td class="fl' + (fl.open > fl.limit ? ' bad' : fl.open >= fl.limit ? ' warn' : '') + '"><b>' + fl.open + '</b> de ' + fl.limit + '</td></tr>';
    }
    h += '<tr class="allrow"><td><b>Totes les zones</b></td>' + [1, 2, 3, 4].map(p => { const c = hd.filter(a => a.cls === p).length; return '<td>' + (c ? '<button class="pk all p' + p + '" data-a="send" data-z="all" data-p="' + p + '" aria-label="Envia totes les P' + p + '">' + c + '</button>' : '<span class="pk0">·</span>') + '</td>'; }).join('') + '<td></td></tr></tbody></table></div><p class="hint">«Al terreny» compta les actuacions enviades i encara obertes, i quantes en pot assumir la zona amb les UBI que hi té (4 per UBI). Si se supera, les unitats perden eficàcia.</p></section></div>';
    return h;
  }
  function pCct() {
    let h = '<h3>Estructures</h3><p class="hint top">Quan activeu un control parc o un punt de comandament, el terreny s\'organitza sol: reparteix les UBI del seu àmbit, fa els relleus i activa la logística. Les zones sense estructura les gestioneu vosaltres des de la sala.</p><div class="tw"><table class="st"><thead><tr><th>Àmbit</th><th>Actuacions</th><th>Estat</th><th></th></tr></thead><tbody>';
    if (!E.SC.multi) { const t = E.total(S), nocp = !S.st.cp.S && !S.st.cp.N; h += '<tr class="agrrow top"><td><b>Agrupació ' + E.AGRUP.name + '</b><small>Grup ' + E.AGRUP.grup + ' · parcs de ' + Object.values(E.PARKS).filter(p => p.agr === E.AGRUP.name).map(p => p.name).join(', ') + '</small></td><td class="num' + (t > 10 && nocp ? ' bad' : '') + '">' + t + '<small>llindar 10</small></td><td>' + (nocp ? chip('Sense control parc', t > 10 ? 'bad' : 'sct') : '') + '</td><td></td></tr>'; }
    for (const g of Object.values(E.AGR)) {

      }
    }
    h += '<tr class="agrrow"><td><b>' + E.SC.cca + '</b><small>Agrupa controls parc i punts de comandament</small></td><td class="num' + (E.pcCount(S) >= 2 && !S.st.cca ? ' bad' : '') + '">' + E.pcCount(S) + '<small>punts de comandament</small></td><td>' + (S.st.cca ? chip('CCA actiu · SISCOM 3', 'cca') : '') + '</td><td><button class="btn" data-a="cca">' + (S.st.cca ? 'Retira el CCA' : 'Escala a CCA') + '</button></td></tr></tbody></table></div>';
    const zsel = (id) => '<select id="' + id + '" data-a="dest" aria-label="Destinació">' + E.ZONES.map(z => '<option value="' + z.id + '"' + (String(dest[id]) === String(z.id) ? ' selected' : '') + '>' + z.name + '</option>').join('') + '</select>';
    const CN = { 1: 'Corona 1 · parcs propers de la regió', 2: 'Corona 2 · següent corona', 3: 'Resta de Catalunya' };
    h += '<h3>Reforç per corones d\'activació</h3><p class="hint top">Podeu enviar UBI de qualsevol parc de Catalunya. «Activa la corona» envia una UBI de cada parc que en conservi una altra de cobertura.</p>';
    for (const c of [1, 2, 3]) {
      const ks = Object.keys(E.PARKS).filter(k => E.PARKS[k].corona === c).sort((a, b) => E.PARKS[a].delay - E.PARKS[b].delay);
      const avail = ks.filter(k => S.ubis.filter(x => x.park === k && x.zone === null && x.dest === null).length >= 2).length;
      h += '<div class="corona"><div class="chead"><b>' + CN[c] + '</b><small>' + ks.length + ' parcs · ' + avail + ' poden cedir una UBI sense quedar descoberts</small>' + (c === 3 ? '<button class="btn ghost" data-a="rest">' + (showRest ? 'Amaga' : 'Mostra') + ' els parcs</button>' : '<span class="send">' + zsel('sg-' + c) + '<button class="btn" data-a="sendg" data-c="' + c + '">Activa la corona</button></span>') + '</div>';
      if (c < 3 || showRest) {
        h += '<div class="tw"><table class="st"><thead><tr><th>Parc</th><th>UBI al parc</th><th>Arribada</th><th>Destinació</th></tr></thead><tbody>';
        for (const k of ks) {
          const p = E.PARKS[k], home = S.ubis.filter(x => x.park === k && x.zone === null && x.dest === null), d = Math.max(1, p.delay - (S.prep.reserva ? 1 : 0));
          h += '<tr><td><b>' + p.name + '</b><small>' + p.region + ' · agrupació ' + p.agr + ' · tipus ' + p.type + '</small></td><td class="num' + (home.length ? '' : ' bad') + '">' + home.length + ' de ' + p.ubi + (home.length ? '' : '<small>sense cobertura</small>') + '</td><td>' + d + (d === 1 ? ' torn' : ' torns') + '</td><td>' + (home.length ? '<span class="send">' + zsel('s-' + k) + '<button class="btn ghost" data-a="send" data-k="' + k + '">Envia una UBI</button></span>' : '') + '</td></tr>';
        }
        h += '</tbody></table></div>';
      }

    h += '<h3>UBI gestionades directament per la sala i unitats en camí</h3>' + ubiTable(mine, E.ZONES.map(z => z.id), true);
    return h;
  }
  function pCp() {
    const act = Object.values(E.AGR).filter(g => S.st.cp[g.id] === 'on');
    if (!act.length) return '<p class="empty">Encara no hi ha cap control parc operatiu. L\'activa el cap de coordinació quan l\'agrupació supera les 10 actuacions, o abans si ho preveu.</p>';
    let h = '';

      const us = S.ubis.filter(u => u.zone !== null && u.zone >= 0 && g.zones.includes(u.zone) && E.zoneOwner(S, u.zone) === 'cp');
      h += '<section class="blk"><h3>Control parc de ' + E.PARKS[g.park].name + ' · ' + g.name + '</h3><div class="areas">' + g.zones.map((z, i) => { const o = S.acts.filter(a => a.zone === z && a.state === 'open'); return '<div class="area' + (S.st.pc[z] === 'on' ? ' ispc' : '') + '"><b>Àrea ' + 'ABCD'[i] + ' · ' + zn(z) + '</b>' + (S.st.pc[z] === 'on' ? '<span>La gestiona el punt de comandament</span>' : '<span>' + o.length + ' obertes · ' + [1, 2, 3, 4].map(p => '<em class="d p' + p + '">P' + p + ' ' + o.filter(a => a.cls === p).length + '</em>').join(' ') + '</span>') + '</div>'; }).join('') + '</div>';
      h += S.logi[g.id] ? '<p class="okline">Logística activa: avituallament, combustible, material de recanvi i unitat Limes.</p>' : '<button class="btn" data-a="logi" data-g="' + g.id + '">Activa la logística i l\'avituallament</button>';
      h += ubiTable(us, g.zones, true) + '<p class="hint">Aquí només hi surten les actuacions que la sala ha enviat. Les UBI les trien per prioritat i proximitat. Una UBI discriminadora tanca duplicats, resol actuacions P4 amb indicacions i corregeix prioritats mal assignades.</p></section>';
    }
    return h;
  }
  function pPc() {
    const zs = Object.keys(S.st.pc).filter(z => S.st.pc[z] === 'on').map(Number);
    if (!zs.length) return '<p class="empty">Encara no hi ha cap punt de comandament operatiu. Es desplega quan un àmbit concret supera les 20 actuacions, o abans si la gravetat ho justifica.</p>';
    let h = '';

      const o = S.acts.filter(a => a.zone === z && a.state === 'open'), g = E.AGR[E.ZONES[z].agr];

      const p1 = o.filter(a => a.kind === 1 && a.cls === 1);

      h += ubiTable(S.ubis.filter(u => u.zone === z), g.zones, false) + '</section>';
    }
    return h;
  }

  /* ---------- cartera dels controls parc i punts de comandament ---------- */
  function cartera() {
    const rows = [];
    for (const g of Object.values(E.AGR)) {
      const zs = g.zones.filter(z => S.st.pc[z] !== 'on'), st = S.st.cp[g.id];
      rows.push({ name: st === 'on' ? 'Control parc ' + E.PARKS[g.park].name : 'Sala · ' + g.name, sub: st === 'on' ? g.name : 'sense control parc', kind: st === 'on' ? 'cp' : 'sct', zs, lim: 10 });
    }
    for (const z in S.st.pc) if (S.st.pc[z] === 'on') rows.push({ name: 'Punt de comandament', sub: E.ZONES[z].name, kind: 'pc', zs: [+z], lim: 20 });
    const data = rows.map(r => {
      const op = S.acts.filter(a => r.zs.includes(a.zone) && a.state === 'open'), hd = S.acts.filter(a => r.zs.includes(a.zone) && a.state === 'held');
      return Object.assign(r, { p: [1, 2, 3, 4].map(p => op.filter(a => a.cls === p).length), held: hd.length, heldP1: hd.filter(a => a.cls === 1).length, ubi: S.ubis.filter(u => r.zs.includes(u.zone)).length, here: S.ubis.filter(u => r.zs.includes(u.zone)), coming: S.ubis.filter(u => u.dest !== null && r.zs.includes(u.dest)).length });
    });
    const max = Math.max(22, ...data.map(d => d.p.reduce((a, b) => a + b, 0) + d.held));
    const pct = n => (100 * n / max).toFixed(2) + '%';
    const res = (d, tot) => {
      const sg = d.here.filter(x => cmdOf(x) === 'Sergent').length, cp = d.here.length - sg, rest = d.here.filter(x => x.mode === 'rest' || x.lock > 0).length;
      return '<div class="res2' + (d.ubi === 0 && tot ? ' bad' : '') + '"><b>' + d.ubi + ' UBI</b>' + (d.coming ? ' · +' + d.coming + ' en camí' : '') + (rest ? ' · ' + rest + ' en descans' : '') + (d.ubi ? '<br>Màx.: <b>' + (sg ? 'Sergent' : 'Caporal') + '</b> (' + sg + ' sgt · ' + cp + ' cap)' : '') + '</div>';
    };
    let h = '<div class="card cart"><div class="carth"><h3>Cartera al terreny</h3><span class="lg">' + [1, 2, 3, 4].map(p => '<i class="sw p' + p + '"></i>P' + p).join(' ') + ' <i class="sw held"></i>Retingudes a sala</span></div>';
    for (const d of data) {
      const tot = d.p.reduce((a, b) => a + b, 0);
      h += '<div class="crow ' + d.kind + '"><div class="cn"><b>' + esc(d.name) + '</b><small>' + esc(d.sub) + '</small>' + res(d, tot) + '</div><div class="cbar" role="img" aria-label="' + esc(d.name) + ': ' + d.p.map((n, i) => 'P' + (i + 1) + ' ' + n).join(', ') + ', ' + d.held + ' retingudes">' +
        d.p.map((n, i) => n ? '<span class="seg p' + (i + 1) + '" style="width:' + pct(n) + '">' + (n * 100 / max >= 4 ? n : '') + '</span>' : '').join('') +
        (d.held ? '<span class="seg held" style="width:' + pct(d.held) + '">' + (d.held * 100 / max >= 4 ? d.held : '') + '</span>' : '') +
        (d.kind !== 'sct' || d.lim === 10 ? '<span class="lim" style="left:' + pct(d.lim) + '" title="Llindar ' + d.lim + '"></span>' : '') + '</div>' +
        '<div class="ct"><b>' + tot + '</b><small>enviades</small>' + (d.heldP1 ? '<em>' + d.heldP1 + ' P1 retinguda' + (d.heldP1 > 1 ? 'es' : '') + '</em>' : '') + '</div></div>';
    }
    return h + '<p class="mapnote">La ratlla vertical marca el llindar: 10 per al control parc, 20 per al punt de comandament.</p></div>';
  }

      '<div class="how"><b>Com es juga</b><ol><li><span>1</span><div><b>Prepareu el dispositiu.</b> Sis missions curtes: cinc decisions de la guia i una prova de les bústies.</div></li><li><span>2</span><div><b>Gestioneu l\'episodi.</b> Cada torn són 15 minuts, de 17:00 a 21:00. Un panell us dirà què toca fer a cada moment.</div></li><li><span>3</span><div><b>Llegiu l\'informe.</b> Puntuació sobre 100 i els moments clau, bons i dolents.</div></li></ol></div>' +

        if (a !== undefined) h += '<p class="eyebrow ' + (m.opts[a].good ? 'ok' : 'bad') + '" style="margin-top:14px">' + (m.opts[a].good ? 'Alineat amb la guia' : 'No és el que indica la guia') + '</p><blockquote>' + esc(m.guia) + '<cite>GUI.CORA.001 · Fase de preparació</cite></blockquote><p class="hint">' + m.fx + '</p><div class="mnext"><button class="btn big" data-a="pnext">' + (st + 1 < M.length ? 'Següent missió' : 'Veure el dispositiu') + '</button></div>';

  function act(a, d, el) {
    flash = '';
    if (a === 'prep') S.prep[d.id] = el.checked;
    else if (a === 'seed') { const v = parseInt(el.value, 10); if (v > 0) { const o = S; S = E.newGame(v, o.sc); for (const k of ['prep', 'pq', 'pstep', 'prac', 'pracSent', 'keys', 'guided']) S[k] = o[k]; } return; }
    else if (a === 'sc') { const g = S.guided; S = E.newGame(S.seed, el.value); S.guided = g; }
    else if (a === 'preset') { const g = S.guided; S = E.newGame(S.seed, S.sc); S.guided = g; }
    else if (a === 'pq') { ensure(); const m = missions()[S.pstep]; if (S.pq[m.id] === undefined) { const o = m.opts[+d.v]; S.pq[m.id] = +d.v; S.prep[m.id] = !!o.good; S.keys.push({ r: 0, msg: 'Preparació · ' + m.title + (o.good ? ': alineat amb la guia.' : ': «' + o.t + '».'), ok: !!o.good }); } }
    else if (a === 'pnext') { ensure(); S.pstep++; }
    else if (a === 'prac') { ensure(); S.prac[d.i] = d.v; }
    else if (a === 'pracsend') S.pracSent = true;
    else if (a === 'guided') S.guided = !guided();
    else if (a === 'start') { E.start(S); tab = 'teoc'; if (guided()) modal = 'intro'; }
    else if (a === 'tab') tab = d.v;
    else if (a === 'cls') { const r = E.classify(S, +d.id, d.v === 'close' ? 'close' : +d.v); if (r === 'sat') flash = 'La sala no té més capacitat aquest torn. La resta d\'avisos queden en espera.'; }
    else if (a === 'cp') E.setCP(S, d.g, !S.st.cp[d.g]);
    else if (a === 'pc') E.setPC(S, +d.z, !S.st.pc[d.z]);
    else if (a === 'cca') { if (E.setCCA(S, !S.st.cca) === 'cal') { tab = 'cct'; } }
    else if (a === 'logi') E.setLogi(S, d.g);
    else if (a === 'send' && d.p) E.send(S, d.z === 'all' ? null : +d.z, +d.p);
    else if (a === 'dest') { dest[el.id] = el.value; return; }
    else if (a === 'rest') showRest = !showRest;
    else if (a === 'sendg') E.sendCorona(S, +d.c, +$('#sg-' + d.c).value);
    else if (a === 'send') { const u = S.ubis.find(x => x.park === d.k && x.zone === null && x.dest === null); if (u) E.moveUbi(S, u.id, +$('#s-' + d.k).value); }
    else if (a === 'move') E.moveUbi(S, d.id, el.value === 'home' ? null : +el.value);
    else if (a === 'mode') E.setMode(S, d.id, el.value);
    else if (a === 'adv') { E.advance(S); if (S.event) tab = E.EVENTS.find(x => x.id === S.event).role; }
    else if (a === 'close') E.finish(S);
    else if (a === 'ans') E.answer(S, +d.v);
    else if (a === 'evok') S.evResult = null;
    else if (a === 'guia') modal = 'guia';
    else if (a === 'reset') modal = 'reset';
    else if (a === 'closem') modal = null;
    else if (a === 'new') { const g = S.guided; S = E.newGame(S.seed, S.sc); S.guided = g; modal = null; tab = 'teoc'; }
    else if (a === 'copy') {
      const sc = S.score, t = 'Simultaneïtat · ' + E.SC.region + ' · ' + E.SC.title + ' (codi ' + S.seed + ')\nPuntuació: ' + sc.total + '/100\nPersones en risc: ' + sc.persones + '\nEstructures i desescalat: ' + sc.estructures + '\nPrioritats i filtratge: ' + sc.prioritats + '\nOperativitat de la sala i del terreny: ' + sc.sala + '\nPreparació, seguretat i logística: ' + sc.seguretat;
      try { navigator.clipboard.writeText(t).then(() => { el.textContent = 'Copiat'; }, () => { el.textContent = 'No s\'ha pogut copiar'; }); } catch (e) { el.textContent = 'No s\'ha pogut copiar'; }
      return;
    }
    render();
  }
  document.addEventListener('click', ev => { const el = ev.target.closest('button[data-a]'); if (el) act(el.dataset.a, el.dataset, el); });
  document.addEventListener('change', ev => { const el = ev.target.closest('select[data-a],input[data-a]'); if (el) act(el.dataset.a, el.dataset, el); });

  function boot(data) { if (data && data.v === 1) { E.use(data.sc); S = data; } else S = E.newGame(2026, 'remn'); render(); }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => S);
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();

</script>
